<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veux-tu être mon Valentin(e) ?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fbcfe8, #f43f5e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #be123c;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 60px;
            align-items: center;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #btn-oui {
            background-color: #22c55e;
            color: white;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        #btn-oui:hover {
            transform: scale(1.05);
        }

        #btn-non {
            background-color: #ef4444;
            color: white;
            position: absolute;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        /* Style pour l'écran de victoire */
        .hidden {
            display: none;
        }

        #success-message img {
            width: 150px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h1>Est-ce qu'on se fait un petit date bientôt ? ✨</h1>
        <div class="buttons">
            <button id="btn-oui" onclick="feteOui()">Oui ! 🥰</button>
            <button id="btn-non" onmouseover="deplacerBouton()" onclick="deplacerBouton()">Non 😢</button>
        </div>
    </div>

    <div class="card hidden" id="success-message">
        <h1>Yay ! J'avais hâte d'entendre ça ❤️</h1>
        <p>Prépare-toi bien, ça va être génial !</p>
    </div>

    <script>
        function deplacerBouton() {
            const btnNon = document.getElementById('btn-non');
            
            // Récupère les dimensions de la fenêtre
            const maxX = window.innerWidth - btnNon.offsetWidth - 50;
            const maxY = window.innerHeight - btnNon.offsetHeight - 50;

            // Génère des coordonnées aléatoires
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            // Applique la position fixe pour qu'il puisse s'évader partout sur l'écran
            btnNon.style.position = 'fixed';
            btnNon.style.left = `${randomX}px`;
            btnNon.style.top = `${randomY}px`;
        }

        function feteOui() {
            document.getElementById('main-card').classList.add('hidden');
            document.getElementById('success-message').classList.remove('hidden');
        }
    </script>

</body>
</html>
